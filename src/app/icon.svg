<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    
    <!-- Letter N Gradient -->
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="#fbbf24" stroke-width="8" stroke-opacity="0.8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="10 6" />

  <!-- Stylized Capital Letter N -->
  <g filter="url(#glow)">
    <!-- Left Vertical Column -->
    <path d="M140 130 h60 v252 h-60 z" fill="url(#nGrad)" rx="8" />
    <!-- Right Vertical Column -->
    <path d="M312 130 h60 v252 h-60 z" fill="url(#nGrad)" rx="8" />
    <!-- Diagonal Column -->
    <path d="M185 130 L327 382 h-40 L145 130 z" fill="url(#nGrad)" />
  </g>
</svg>
